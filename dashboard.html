<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — The Brand Factory NOLA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0d0d0d; color: #f5f0e8; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid #222; }
    .logo { color: #c9a84c; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; }
    main { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Brand Factory <span style="color:#f5f0e8; font-weight: 400;">NOLA</span></a>
    <a href="/" style="color:#888; text-decoration: underline;">Home</a>
  </header>
  <main>
    <h1 style="margin-bottom: 1rem;">Your Dashboard</h1>
    <p class="empty">Auth and order history will appear here once connected to the backend.</p>
  </main>
</body>
</html>
