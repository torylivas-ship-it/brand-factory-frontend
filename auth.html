<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Brand Factory NOLA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #f5f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .logo .wordmark {
      font-size: 1.6rem;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo .sub {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #c9a84c;
      border-radius: 10px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
      margin-bottom: 2rem;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: #666;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      letter-spacing: 0.5px;
    }
    .tab-btn.active {
      color: #c9a84c;
      border-bottom-color: #c9a84c;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f5f0e8;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #c9a84c; }
    input::placeholder { color: #444; }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: #c9a84c;
      color: #0d0d0d;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.3);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .success-msg {
      background: rgba(22,163,74,0.12);
      border: 1px solid rgba(22,163,74,0.3);
      color: #86efac;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .divider {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      margin: 1.25rem 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #222;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #444;
      margin-top: 2rem;
    }
    .footer-note a { color: #c9a84c; text-decoration: none; }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo">
    <div class="wordmark">Brand Factory</div>
    <div class="sub">New Orleans</div>
  </div>

  <!-- Auth card -->
  <div class="card">
    <!-- Tab switcher -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')" id="tab-login">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Create Account</button>
    </div>

    <!-- Error / success banners -->
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <!-- Login panel -->
    <div class="tab-panel active" id="panel-login">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" type="submit" id="login-btn">Sign In</button>
      </form>
    </div>

    <!-- Sign-up panel -->
    <div class="tab-panel" id="panel-signup">
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input id="signup-name" type="text" placeholder="Your name" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn-primary" type="submit" id="signup-btn">Create Account</button>
      </form>
    </div>
  </div>

  <div class="footer-note">
    By signing in you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>
  </div>

  <!-- Config: set real values in your deployment env -->
  <script>
    window.BFN_CONFIG = {
      apiUrl: "http://localhost:8000",          // replace with Railway backend URL in prod
      supabaseUrl: "https://YOUR_PROJECT.supabase.co",
      supabaseAnonKey: "YOUR_SUPABASE_ANON_KEY",
    };
  </script>
  <script src="api.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById(`tab-${tab}`).classList.add("active");
      document.getElementById(`panel-${tab}`).classList.add("active");
      clearMessages();
    }

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("success-msg").style.display = "none";
    }

    function showSuccess(msg) {
      const el = document.getElementById("success-msg");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("error-msg").style.display = "none";
    }

    function clearMessages() {
      document.getElementById("error-msg").style.display = "none";
      document.getElementById("success-msg").style.display = "none";
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in…";

      try {
        await BFN.signIn(
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-password").value
        );
        showSuccess("Welcome back! Redirecting…");
        setTimeout(() => (window.location.href = "/dashboard.html"), 800);
      } catch (err) {
        showError(err.message || "Sign-in failed. Check your credentials.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }

    async function handleSignUp(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById("signup-btn");
      btn.disabled = true;
      btn.textContent = "Creating account…";

      try {
        await BFN.signUp(
          document.getElementById("signup-email").value.trim(),
          document.getElementById("signup-password").value,
          document.getElementById("signup-name").value.trim()
        );
        showSuccess("Account created! Check your email to confirm, then sign in.");
        setTimeout(() => switchTab("login"), 2500);
      } catch (err) {
        showError(err.message || "Sign-up failed. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }

    // Redirect if already logged in
    if (BFN.getCurrentUser() && localStorage.getItem("bfn_token")) {
      window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
