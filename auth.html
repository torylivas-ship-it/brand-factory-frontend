<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Brand Factory NOLA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brass: #c9a24a; --brass-soft: rgba(201,162,74,0.12); --brass-bright: #e2c37c;
      --bg: #0c0a10; --card: #1a151f; --border: rgba(255,255,255,0.1);
      --text: #f3ead6; --muted: #9c9184;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }

    .logo-block { text-align: center; margin-bottom: 2.5rem; }
    .logo-block .wordmark { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 600; }
    .logo-block .wordmark em { color: var(--brass); font-style: normal; }
    .logo-block .stamp {
      width: 64px; height: 64px; border-radius: 50%; border: 2.5px double var(--brass);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; color: var(--brass);
      text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.42rem; line-height: 1.3;
      margin: 0 auto 1rem; background: var(--card);
    }
    .logo-block .stamp span { font-size: 0.8rem; margin-bottom: 0.1rem; display: block; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--brass);
      border-radius: 6px; padding: 2.5rem; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .tab-btn {
      flex: 1; background: none; border: none; color: var(--muted); font-size: 0.92rem; font-weight: 600;
      padding: 0.75rem; cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s; font-family: inherit;
    }
    .tab-btn.active { color: var(--brass); border-bottom-color: var(--brass); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.8rem 1rem; background: #14101a; border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: var(--brass); }
    input::placeholder { color: #5a5348; }

    .btn-primary {
      width: 100%; padding: 0.9rem; background: var(--brass); color: #0c0a10; border: none;
      border-radius: 3px; font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.2s, transform 0.1s; margin-top: 0.5rem; font-family: inherit;
    }
    .btn-primary:hover:not(:disabled) { background: var(--brass-bright); }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .msg { padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg.show { display: block; }
    .error-msg { background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
    .success-msg { background: rgba(92,179,146,0.12); border: 1px solid rgba(92,179,146,0.3); color: #8fdcbc; }

    .footer-note { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 2rem; }
    .footer-note a { color: var(--brass); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo-block">
    <div class="stamp"><span>✦</span>Est.<br>NOLA</div>
    <div class="wordmark">Brand Factory <em>NOLA</em></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')" id="tab-login">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Create Account</button>
    </div>

    <div class="msg error-msg" id="error-msg"></div>
    <div class="msg success-msg" id="success-msg"></div>

    <div class="tab-panel active" id="panel-login">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" type="submit" id="login-btn">Sign In</button>
      </form>
    </div>

    <div class="tab-panel" id="panel-signup">
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required />
        </div>
        <button class="btn-primary" type="submit" id="signup-btn">Create Account</button>
      </form>
    </div>
  </div>

  <p class="footer-note">Already bought a pack as a guest? Sign up with the <strong>same email</strong> and it'll show up automatically.<br><a href="/">← Back to home</a></p>

  <script src="supabase.min.js"></script>
  <script src="api.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById(`tab-${tab}`).classList.add("active");
      document.getElementById(`panel-${tab}`).classList.add("active");
      clearMessages();
    }

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.classList.add("show");
      document.getElementById("success-msg").classList.remove("show");
    }

    function showSuccess(msg) {
      const el = document.getElementById("success-msg");
      el.textContent = msg;
      el.classList.add("show");
      document.getElementById("error-msg").classList.remove("show");
    }

    function clearMessages() {
      document.getElementById("error-msg").classList.remove("show");
      document.getElementById("success-msg").classList.remove("show");
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        await BFN.signIn(
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-password").value
        );
        showSuccess("Welcome back! Redirecting…");
        setTimeout(() => (window.location.href = "/dashboard"), 700);
      } catch (err) {
        showError(err.message || "Sign-in failed. Check your credentials.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }

    async function handleSignUp(e) {
      e.preventDefault();
      clearMessages();
      const btn = document.getElementById("signup-btn");
      btn.disabled = true;
      btn.textContent = "Creating account…";
      try {
        const result = await BFN.signUp(
          document.getElementById("signup-email").value.trim(),
          document.getElementById("signup-password").value
        );
        if (result.session) {
          showSuccess("Account created! Redirecting…");
          setTimeout(() => (window.location.href = "/dashboard"), 700);
        } else {
          showSuccess("Account created! Check your email to confirm, then sign in.");
          setTimeout(() => switchTab("login"), 2500);
        }
      } catch (err) {
        showError(err.message || "Sign-up failed. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }

    (async () => {
      const user = await BFN.getCurrentUser();
      if (user) window.location.href = "/dashboard";
    })();
  </script>
</body>
</html>
